services:
  backend:
    build:
      target: dev
    environment:
      APP_ENV: development
    volumes:
      - ./backend:/app
      # The ./backend:/app mount shadows the image's /app/scripts, so mount the
      # knowledgebase build script back in for the admin "rebuild" action in dev.
      - ./scripts:/app/scripts
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      target: dev
    environment:
      VITE_DEV_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
