services:
  backend:
    build:
      target: dev
    environment:
      APP_ENV: development
    volumes:
      - ./backend:/app
      # The ./backend:/app mount shadows the image's /app/scripts, so mount the
      # knowledgebase build script back in for the admin "rebuild" action in dev.
      - ./scripts:/app/scripts
    # No command: the dev image's own (backend/Dockerfile) starts uvicorn with --reload.

  import-worker:
    build:
      target: dev
    environment:
      APP_ENV: development
    # The code as the backend runs it, but not reloaded when it changes: a restart stops a
    # running import where it is. Run `docker compose restart import-worker` to take a change.
    volumes:
      - ./backend:/app

  frontend:
    build:
      target: dev
    environment:
      VITE_DEV_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
