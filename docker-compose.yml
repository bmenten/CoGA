services:
  postgres:
    # Digest-pinned (tag kept for readability) for reproducible local stacks.
    image: postgres:16@sha256:fe03a7605299a34ddf5e4f285dff78c3d7190a576b3c6b46f2fcff69f4bffd54
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Loopback only (#520): reachable from this machine's tools (psql), not the network.
    ports:
      - "127.0.0.1:5432:5432"

  clickhouse:
    image: clickhouse/clickhouse-server:25.3@sha256:b627d7a9bc0e0c1bac26cdbe9d2fc6316faa29c5d8a174f28f5abd57d0fa6ba2
    restart: always
    # ClickHouse needs time to finish flushing/merging on SIGTERM. Docker's
    # default 10s grace can SIGKILL it mid-flush, truncating parts into
    # broken-on-start corruption on the next boot (the 2026-06-11 volume event).
    stop_grace_period: 5m
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --host 127.0.0.1 --port 9000 --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # Query-level memory guards (spill heavy GROUP BY/ORDER BY to disk + per-query
      # cap) so the Chromosome View's concurrent coverage/segment/SV query burst
      # degrades gracefully instead of hitting the server memory cap.
      - ./clickhouse/users.d/memory-guards.xml:/etc/clickhouse-server/users.d/memory-guards.xml:ro
    # Loopback only (#520), like Postgres.
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"

  backend:
    restart: unless-stopped
    # The production image runs as a non-root user (see backend/Dockerfile). Locally we
    # bind-mount a host-owned ./data that the app writes to under the default
    # storage_backend, so override back to root here to keep that writable. Cloud Run
    # uses the image default (non-root) with read-only refdata + GCS-API PHI storage.
    user: root
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
      args:
        # Populate before `docker compose build`, e.g.
        #   export APP_VERSION="$(cat VERSION)" GIT_SHA="$(git rev-parse --short=12 HEAD)"
        APP_VERSION: ${APP_VERSION:-0.0.0+unknown}
        GIT_SHA: ${GIT_SHA:-unknown}
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      # The backend sits behind the frontend's /api proxy, which sends one clean
      # X-Forwarded-For: take the client from there (#520).
      TRUSTED_PROXY_HOPS: ${BACKEND_TRUSTED_PROXY_HOPS:-1}
    # Loopback only (#520): the UI reaches the API through the frontend's /api proxy;
    # this port is for local tools and the /docs page.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    healthcheck:
      # Liveness via stdlib (no curl in the image): non-200 / unreachable -> unhealthy.
      test:
        - CMD-SHELL
        - >-
          python -c "import sys,urllib.request;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      # Startup runs schema init + seeds (+ optional reference bootstrap); give it
      # room before failures count against the container.
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_GITHUB_REPOSITORY_URL: ${VITE_GITHUB_REPOSITORY_URL:-}
        VITE_GITHUB_RELEASES_URL: ${VITE_GITHUB_RELEASES_URL:-}
        VITE_GITHUB_ISSUES_URL: ${VITE_GITHUB_ISSUES_URL:-}
    # Only what the frontend server reads (#520): passing the whole .env handed the
    # backend's database passwords and signing keys to a container that needs none.
    environment:
      BACKEND_URL: http://backend:8000
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
      API_PROXY_TIMEOUT_MS: ${API_PROXY_TIMEOUT_MS:-}
      # Proxies in front of the frontend; 0 when it is the edge. Its own name in .env, so
      # it cannot be confused with the backend's hop count below.
      TRUSTED_PROXY_HOPS: ${FRONTEND_TRUSTED_PROXY_HOPS:-0}
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        # Don't serve the UI until the backend is healthy, so users never hit the
        # "Unable to reach API" state from a still-starting or crash-looping backend.
        condition: service_healthy

volumes:
  postgres_data:
  clickhouse_data:
