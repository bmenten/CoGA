# Build the backend image from the REPO ROOT context so backend/Dockerfile's
# `COPY backend/db`, `COPY backend/app`, and the `COPY scripts/...` of the two scripts
# the image runs all resolve (they live at repo-root scripts/). Build
# identity (APP_VERSION/GIT_SHA) is injected as build-args and baked into the image
# — these are frozen into signed-report content hashes, so they must be real.
#
# Invoke from repo root:
#   gcloud builds submit --config=ci/cloudbuild.backend.yaml \
#     --substitutions=_IMAGE=<url>,_APP_VERSION=<v>,_GIT_SHA=<sha> .

# The builder at the tag and digest ci/pinned-images.Dockerfile pins, which Dependabot
# refreshes (backend/tests/test_pinned_images.py holds the two alike).
steps:
  - name: gcr.io/cloud-builders/docker:20.10.24@sha256:fbc05705e6f24467e40ae8a4097ab9b8fae1116551f838fa2c55f4367427fc36
    args:
      - build
      - -f
      - backend/Dockerfile
      - --target
      - production
      - --build-arg
      - APP_VERSION=${_APP_VERSION}
      - --build-arg
      - GIT_SHA=${_GIT_SHA}
      - -t
      - ${_IMAGE}
      - .

images:
  - ${_IMAGE}

options:
  # A user-specified build service account requires explicit log routing.
  logging: CLOUD_LOGGING_ONLY
