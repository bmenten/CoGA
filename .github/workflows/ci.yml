name: CI

# Run the same gates that were previously only run by hand. Mark "backend" and
# "frontend" as required status checks in branch protection so they must pass
# before a PR can merge.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only check out and test the code, so the workflow
# GITHUB_TOKEN needs no more than read access to repo contents (mirrors security.yml).
permissions:
  contents: read

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Lint (ruff)
        # Pyflakes plus the checks for real defects ([tool.ruff] in pyproject.toml, #526).
        run: ruff check .
      - name: Type-check the clinical-critical modules (mypy)
        # The modules listed under [tool.mypy] in pyproject.toml (#526).
        run: mypy
      - name: Frontend API types match the backend's schema
        # frontend/src/lib/apiSchema.generated.ts is generated from the OpenAPI schema;
        # a backend model change must regenerate it (#528). The frontend job's tsc then
        # checks the hand-written types against it (src/lib/apiContract.ts).
        run: python scripts/generate-api-types.py --check
      - name: Run tests with coverage
        # The suite is self-contained (Postgres/ClickHouse access is mocked), so
        # no service containers are required. Honours the pytest testpaths in pyproject.toml
        # (backend/tests). --cov-fail-under is the global floor (#268). The data
        # file is kept for the combined report in the `coverage` job (#526).
        env:
          COVERAGE_FILE: coverage-unit.data
        run: >
          python -m pytest -q
          --cov=backend/app
          --cov-report=term-missing:skip-covered
          --cov-report=json:coverage.json
          --cov-fail-under=70
      - name: Enforce clinical-critical coverage floors
        run: python scripts/check-coverage-floor.py coverage.json
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: |
            coverage.json
            coverage-unit.data

  smoke:
    name: smoke (real startup against Postgres + ClickHouse)
    runs-on: ubuntu-latest
    # The datastores every integration job runs against; e2e and e2e-playwright reuse
    # this block, so an image digest is bumped in one place.
    services: &datastores
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: coga
          POSTGRES_PASSWORD: coga
          POSTGRES_DB: coga
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coga -d coga"
          --health-interval 5s --health-timeout 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:26.8@sha256:4769eec6a9b9842a7d102c8bdfca0400128bc6edf65dec4e19a7d3a2b25f32db
        env:
          # ClickHouse rejects the empty-password default user for network clients;
          # provision a real one (matching the app env below) so authentication succeeds.
          CLICKHOUSE_DB: coga
          CLICKHOUSE_USER: coga
          CLICKHOUSE_PASSWORD: coga
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      SECRET_KEY: ci-smoke-not-a-real-secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: coga
      POSTGRES_USER: coga
      POSTGRES_PASSWORD: coga
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_DATABASE: coga
      CLICKHOUSE_USER: coga
      CLICKHOUSE_PASSWORD: coga
      ADMIN_EMAIL: admin@example.com
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-admin-not-a-real-secret
      # Keep startup light: no large reference / HPO / gene data files in CI.
      REFERENCE_BOOTSTRAP_ENABLED: "false"
      HPO_BOOTSTRAP_ON_STARTUP: "false"
      GENE_REFERENCE_BOOTSTRAP_ON_STARTUP: "false"
      RUN_INTEGRATION: "1"
      # GCS storage backend integration test runs against fake-gcs-server (started below).
      GCS_ENDPOINT_URL: "http://localhost:4443"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Start fake-gcs-server (GCS storage backend integration test)
        run: |
          docker run -d --name fake-gcs -p 4443:4443 fsouza/fake-gcs-server:1.56.1@sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef \
            -scheme http -port 4443 -public-host 127.0.0.1:4443
      - name: Boot the app against real datastores and probe health
        # Runs the real lifespan (Postgres + ClickHouse schema init, admin seed)
        # and asserts the app serves — catches startup crash-loops the unit suite
        # cannot (e.g. a schema file that fails to apply).
        # Coverage is recorded (not gated here) for the combined report (#526).
        env:
          COVERAGE_FILE: coverage-smoke.data
        run: python -m pytest backend/tests/integration -q --cov=backend/app --cov-report=
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-coverage
          path: coverage-smoke.data

  e2e:
    name: e2e (golden-trio pipeline against Postgres + ClickHouse)
    runs-on: ubuntu-latest
    services: *datastores
    env:
      APP_ENV: test
      SECRET_KEY: ci-e2e-not-a-real-secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: coga
      POSTGRES_USER: coga
      POSTGRES_PASSWORD: coga
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_DATABASE: coga
      CLICKHOUSE_USER: coga
      CLICKHOUSE_PASSWORD: coga
      ADMIN_EMAIL: admin@example.com
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-admin-not-a-real-secret
      # Keep startup light: no large reference / HPO / gene data files in CI.
      REFERENCE_BOOTSTRAP_ENABLED: "false"
      HPO_BOOTSTRAP_ON_STARTUP: "false"
      GENE_REFERENCE_BOOTSTRAP_ON_STARTUP: "false"
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run the end-to-end harness against real datastores
        # Imports a golden-trio package + the demo bundles through the real
        # pipeline and asserts every stage (ingestion -> ClickHouse/Postgres ->
        # query/API -> review/audit/sign-out) against documented expected results.
        # Runs in its own job like `smoke`; coverage is recorded for the combined
        # report (#526).
        env:
          COVERAGE_FILE: coverage-e2e.data
        run: python -m pytest backend/tests/e2e -q --cov=backend/app --cov-report=
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-coverage
          path: coverage-e2e.data

  coverage:
    # The import pipeline, the integrity anchors and the sign-out path are covered
    # mostly by the smoke and e2e jobs, which run against real datastores; the unit
    # job alone under-reports them (#526). This combines the three runs and holds
    # floors on the combined figure.
    name: coverage (unit + smoke + e2e combined)
    needs: [backend, smoke, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Download the coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-coverage"
          merge-multiple: true
      - name: Combine and report
        run: |
          python -m coverage combine --keep coverage-unit.data coverage-smoke.data coverage-e2e.data
          python -m coverage json -o coverage-combined.json
          python -m coverage report --skip-covered --sort=cover | tail -n 40
      - name: Enforce the combined coverage floors
        run: python scripts/check-coverage-floor.py --combined coverage-combined.json
      - name: Upload the combined report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: combined-coverage
          path: coverage-combined.json

  frontend:
    name: frontend (tsc + eslint + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run tsc
      - name: Lint
        run: npm run lint
      - name: Test with coverage
        # vitest enforces the coverage thresholds in vite.config.mts (#273); the run
        # fails if any metric drops below its ratchet floor.
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/coverage-summary.json

  e2e-playwright:
    name: e2e-playwright (browser journeys)
    runs-on: ubuntu-latest
    services: *datastores
    env:
      APP_ENV: test
      SECRET_KEY: ci-playwright-not-a-real-secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: coga
      POSTGRES_USER: coga
      POSTGRES_PASSWORD: coga
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_DATABASE: coga
      CLICKHOUSE_USER: coga
      CLICKHOUSE_PASSWORD: coga
      ADMIN_EMAIL: admin@example.com
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-admin-not-a-real-secret
      REFERENCE_BOOTSTRAP_ENABLED: "false"
      HPO_BOOTSTRAP_ON_STARTUP: "false"
      GENE_REFERENCE_BOOTSTRAP_ON_STARTUP: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Seed the golden trio + a known e2e user
        # Direct DB seed (no server needed yet); Playwright's webServer boots the
        # backend + frontend and the spec logs in as this user.
        run: python scripts/seed_playwright_e2e.py
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser journeys
        # Playwright starts uvicorn (python on PATH), builds the production bundle and
        # serves it through server.mjs with its CSP (playwright.config.ts), and drives
        # Chromium through the journeys; a CSP violation fails the run (#567).
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

  sbom:
    name: sbom (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Generate the SBOMs (backend requirements.txt, frontend package-lock.json)
        # The same script and pinned generators as a local run, without Docker here.
        run: ./scripts/generate-sbom.sh --native
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom/*.cdx.json
          retention-days: 90

  images:
    # build.yml builds the release images in Cloud Build only after a merge, and not at all
    # until Google Cloud is configured. This job builds both on every pull request and push
    # to main, so a Dockerfile that no longer builds shows on its pull request instead of at
    # the release candidate. Each `docker build` below is the one its ci/cloudbuild.*.yaml
    # runs (Dockerfile, target, repository-root context, build arguments);
    # backend/tests/test_deployment_config.py fails when the two drift apart. Nothing is
    # pushed: the job has no registry credentials, and the images stay on the runner.
    name: images (production Docker builds, not pushed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the backend image (as ci/cloudbuild.backend.yaml)
        # Stamped as build.yml stamps a release build (TF-18 §2): the version from VERSION,
        # the commit as its 12-character hash.
        run: |
          docker build \
            -f backend/Dockerfile \
            --target production \
            --build-arg APP_VERSION="$(cat VERSION)" \
            --build-arg GIT_SHA="$(git rev-parse --short=12 HEAD)" \
            -t coga-backend:ci \
            .
      - name: Check the backend image imports the app and reports its build
        # Importing app.main loads the routers and the services they use, so a module or a
        # package the image lacks fails here. Nothing is served and no datastore is needed.
        # APP_ENV=development: outside development the settings refuse to load without real
        # secrets.
        run: |
          docker run --rm \
            -e APP_ENV=development \
            -e EXPECTED_APP_VERSION="$(cat VERSION)" \
            -e EXPECTED_GIT_SHA="$(git rev-parse --short=12 HEAD)" \
            coga-backend:ci python -c '
          import os
          import app.main
          from app.core.config import settings
          assert os.getuid() != 0, "the production image runs as root"
          assert settings.app_version == os.environ["EXPECTED_APP_VERSION"], settings.app_version
          assert settings.git_sha == os.environ["EXPECTED_GIT_SHA"], settings.git_sha
          '
      - name: Build the frontend image (as ci/cloudbuild.frontend.yaml)
        # The build arguments build.yml passes: the API under /api, no GitHub links, and the
        # problem-report route from the same repository variable (empty while it is unset),
        # passed via env and quoted.
        env:
          PROBLEM_REPORT_URL: ${{ vars.COGA_PROBLEM_REPORT_URL }}
        run: |
          docker build \
            -f frontend/Dockerfile \
            --target production \
            --build-arg VITE_API_BASE_URL=/api \
            --build-arg VITE_GITHUB_REPOSITORY_URL= \
            --build-arg VITE_GITHUB_RELEASES_URL= \
            --build-arg VITE_GITHUB_ISSUES_URL= \
            --build-arg VITE_PROBLEM_REPORT_URL="${PROBLEM_REPORT_URL}" \
            -t coga-frontend:ci \
            .
      - name: Check the frontend image holds the built app and its server's packages
        # Importing server.mjs loads express and the proxy and header modules without
        # listening: it listens only when run as `node server.mjs`.
        run: |
          docker run --rm coga-frontend:ci node --input-type=module -e '
          import { existsSync } from "node:fs";
          await import("./server.mjs");
          if (!existsSync("dist/index.html")) throw new Error("dist/index.html is missing");
          if (process.getuid() === 0) throw new Error("the production image runs as root");
          '

  catalogue:
    # Guards the generated/derived docs that nothing else would catch drifting. Despite
    # the job name (kept verbatim — it is a required status check in branch protection,
    # and renaming it would leave the requirement permanently pending), this covers two
    # invariants: the test catalogue, and the handleiding page.
    name: catalogue (test overview in sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check docs/testing.md lists every test file
        run: ./scripts/check-test-catalogue.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the handleiding generator's dependency
        # Pinned (#520): the version the committed HTML is generated and checked with.
        run: pip install markdown==3.10.3
      - name: Check the handleiding page matches its Markdown
        # The HTML is generated but committed (it is what the review board opens), so a
        # chapter edit can land without a rebuild — as in #387, where the page kept a
        # stale heading. build_site.py is deterministic, so any diff here is real drift.
        run: ./scripts/check-handleiding-sync.sh
