name: CI

# Run the same gates that were previously only run by hand. Mark "backend" and
# "frontend" as required status checks in branch protection so they must pass
# before a PR can merge.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only check out and test the code, so the workflow
# GITHUB_TOKEN needs no more than read access to repo contents (mirrors security.yml).
permissions:
  contents: read

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run tests with coverage
        # The suite is self-contained (Postgres/ClickHouse access is mocked), so
        # no service containers are required. Honours pytest.ini testpaths
        # (tests + backend/tests). --cov-fail-under is the global floor (P2-7).
        run: >
          python -m pytest -q
          --cov=backend/app
          --cov-report=term-missing:skip-covered
          --cov-report=json:coverage.json
          --cov-fail-under=58
      - name: Enforce clinical-critical coverage floors
        run: python scripts/check-coverage-floor.py coverage.json
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: coverage.json

  smoke:
    name: smoke (real startup against Postgres + ClickHouse)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coga
          POSTGRES_PASSWORD: coga
          POSTGRES_DB: coga
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coga -d coga"
          --health-interval 5s --health-timeout 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        env:
          # 25.3 rejects the empty-password default user; provision a real one
          # (matching the app env below) so authentication succeeds.
          CLICKHOUSE_DB: coga
          CLICKHOUSE_USER: coga
          CLICKHOUSE_PASSWORD: coga
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      SECRET_KEY: ci-smoke-not-a-real-secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: coga
      POSTGRES_USER: coga
      POSTGRES_PASSWORD: coga
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_DATABASE: coga
      CLICKHOUSE_USER: coga
      CLICKHOUSE_PASSWORD: coga
      ADMIN_EMAIL: admin@example.com
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-admin-not-a-real-secret
      # Keep startup light: no large reference / HPO / gene data files in CI.
      REFERENCE_BOOTSTRAP_ENABLED: "false"
      HPO_BOOTSTRAP_ON_STARTUP: "false"
      GENE_REFERENCE_BOOTSTRAP_ON_STARTUP: "false"
      RUN_INTEGRATION: "1"
      # GCS storage backend integration test runs against fake-gcs-server (started below).
      GCS_ENDPOINT_URL: "http://localhost:4443"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Start fake-gcs-server (GCS storage backend integration test)
        run: |
          docker run -d --name fake-gcs -p 4443:4443 fsouza/fake-gcs-server \
            -scheme http -port 4443 -public-host 127.0.0.1:4443
      - name: Boot the app against real datastores and probe health
        # Runs the real lifespan (Postgres + ClickHouse schema init, admin seed)
        # and asserts the app serves — catches startup crash-loops the unit suite
        # cannot (e.g. a schema file that fails to apply).
        run: python -m pytest backend/tests/integration -q

  e2e:
    name: e2e (golden-trio pipeline against Postgres + ClickHouse)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coga
          POSTGRES_PASSWORD: coga
          POSTGRES_DB: coga
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coga -d coga"
          --health-interval 5s --health-timeout 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        env:
          # 25.3 rejects the empty-password default user; provision a real one
          # (matching the app env below) so authentication succeeds.
          CLICKHOUSE_DB: coga
          CLICKHOUSE_USER: coga
          CLICKHOUSE_PASSWORD: coga
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      SECRET_KEY: ci-e2e-not-a-real-secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: coga
      POSTGRES_USER: coga
      POSTGRES_PASSWORD: coga
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_DATABASE: coga
      CLICKHOUSE_USER: coga
      CLICKHOUSE_PASSWORD: coga
      ADMIN_EMAIL: admin@example.com
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-admin-not-a-real-secret
      # Keep startup light: no large reference / HPO / gene data files in CI.
      REFERENCE_BOOTSTRAP_ENABLED: "false"
      HPO_BOOTSTRAP_ON_STARTUP: "false"
      GENE_REFERENCE_BOOTSTRAP_ON_STARTUP: "false"
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run the end-to-end harness against real datastores
        # Imports a golden-trio package + the demo bundles through the real
        # pipeline and asserts every stage (ingestion -> ClickHouse/Postgres ->
        # query/API -> review/audit/sign-out) against documented expected results.
        # Runs in its own job (not under coverage) like `smoke`.
        run: python -m pytest backend/tests/e2e -q

  frontend:
    name: frontend (tsc + eslint + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run tsc
      - name: Lint
        run: npm run lint
      - name: Test with coverage
        # vitest enforces the coverage thresholds in vite.config.mts (P2-7b); the run
        # fails if any metric drops below its ratchet floor.
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/coverage-summary.json

  e2e-playwright:
    name: e2e-playwright (browser journeys)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coga
          POSTGRES_PASSWORD: coga
          POSTGRES_DB: coga
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coga -d coga"
          --health-interval 5s --health-timeout 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        env:
          CLICKHOUSE_DB: coga
          CLICKHOUSE_USER: coga
          CLICKHOUSE_PASSWORD: coga
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      SECRET_KEY: ci-playwright-not-a-real-secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: coga
      POSTGRES_USER: coga
      POSTGRES_PASSWORD: coga
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_DATABASE: coga
      CLICKHOUSE_USER: coga
      CLICKHOUSE_PASSWORD: coga
      ADMIN_EMAIL: admin@example.com
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-admin-not-a-real-secret
      REFERENCE_BOOTSTRAP_ENABLED: "false"
      HPO_BOOTSTRAP_ON_STARTUP: "false"
      GENE_REFERENCE_BOOTSTRAP_ON_STARTUP: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Seed the golden trio + a known e2e user
        # Direct DB seed (no server needed yet); Playwright's webServer boots the
        # backend + frontend and the spec logs in as this user.
        run: python scripts/seed_playwright_e2e.py
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser journeys
        # Playwright starts uvicorn (python on PATH) + the Vite dev server and drives
        # Chromium through login -> family workspace -> genome overview.
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

  sbom:
    name: sbom (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - name: Generate backend SBOM (from hash-locked requirements.txt)
        run: |
          pip install cyclonedx-bom==7.3.0
          mkdir -p sbom
          cyclonedx-py requirements backend/requirements.txt \
            --output-format json > sbom/backend.cdx.json
      - name: Generate frontend SBOM (from package-lock.json)
        run: |
          # --ignore-npm-errors: Tailwind v4 pulls in the optional package
          # @tailwindcss/oxide-wasm32-wasi, whose transitive deps npm omits from
          # the lockfile on platforms that don't use the wasm binary. `npm ls`
          # (run internally by cyclonedx-npm) then exits non-zero on those
          # "missing" optional sub-deps; the flag tolerates that while still
          # emitting a complete SBOM for everything that is installed.
          npx --yes @cyclonedx/cyclonedx-npm@5.0.0 \
            --package-lock-only --output-format json --output-reproducible --ignore-npm-errors \
            --output-file sbom/frontend.cdx.json frontend/package.json
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom/*.cdx.json
          retention-days: 90

  catalogue:
    name: catalogue (test overview in sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check docs/testing.md lists every test file
        run: ./scripts/check-test-catalogue.sh
