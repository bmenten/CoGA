name: Build, push, and deploy (GCP)

on:
  # Publishing a GitHub Release is the single trigger for a release build: it is the
  # deliberate, recorded act, and it is the only tag-borne event that reaches `deploy`.
  # `push: tags` is deliberately NOT a trigger — it fired a second, complete build of the
  # same commit that raced the release run to push identical image tags, and could never
  # deploy (see the `deploy` condition below), so it produced only duplicate work and a
  # nondeterministic winner. Creating a release from a new tag now runs this once.
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub's merge queue (OPS-22): a queued group runs tf-validate only, so the ruleset may
  # require it; prepare, and with it every build, deploy and SBOM job, never runs for a group.
  merge_group:
    types: [checks_requested]

# Never let two runs for the same ref overlap. Both the release path and the main path end
# in `terraform apply -auto-approve` against one shared state file, so concurrent runs race
# on the state lock and can apply out of order. Queue rather than cancel: aborting a run
# mid-apply is worse than making the next one wait.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_PROJECT_ID: ${{ secrets.GCP_REGISTRY_PROJECT_ID }}
  CLOUDBUILD_BUCKET: ${{ secrets.GCP_CLOUDBUILD_STAGING_BUCKET }}
  WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
  COGA_PROJECT_ID: ${{ secrets.GCP_COGA_PROJECT_ID }}
  TF_STATE_BUCKET: ${{ secrets.GCP_COGA_TF_STATE_BUCKET }}
  GCP_ENV: dev
  GCP_REGION_SHORT: ${{ vars.GCP_REGION_SHORT }}
  GCP_REGION: europe-west1
  REGISTRY_HOST: europe-west1-docker.pkg.dev
  AR_REPO: gen-ghreg-shared-gbl

jobs:
  # ---- PR safety: validate Terraform without any cloud credentials -----------
  tf-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # terraform/versions.tf requires 1.11+ (write-only arguments).
          terraform_version: 1.16.6
      - name: terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: terraform init (no backend)
        working-directory: terraform
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: terraform
        run: terraform validate

  prepare:
    # Build, push and deploy only for a push to main or a published release: never for a
    # pull request (no auto-apply of infra from PR code) or a merge-queue group. Every job
    # below needs this one.
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      repo_name: ${{ steps.meta.outputs.repo_name }}
      app_version: ${{ steps.meta.outputs.app_version }}
      git_sha: ${{ steps.meta.outputs.git_sha }}
      gcp_configured: ${{ steps.gate.outputs.gcp_configured }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: whether a release tag is on main is an ancestry question,
          # which a shallow clone cannot answer.
          fetch-depth: 0
      - name: Check the release tag is on main
        # A release is built only from a commit on main: one that passed main's required
        # checks and that QA's four-eyes review covers (TF-18 section 6). Runs before
        # anything is stamped or built, so a tag on any other commit fails the release here.
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          ./scripts/check-release-on-main.sh "$REF_NAME" origin/main
      - name: Check the release version identifies this build
        # Runs BEFORE any metadata is computed or any image is stamped, so a release whose
        # tag and VERSION disagree fails loudly instead of shipping a mislabelled image.
        # On a tag the tag must be exactly `v<VERSION>`; otherwise VERSION is only checked
        # for well-formedness. See TF-18 section 2 — the stamped version is what appears in
        # /api/version, in the app and report footers, and in every signed report.
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            ./scripts/check-release-version.sh "$REF_NAME"
          else
            ./scripts/check-release-version.sh
          fi
      - name: Compute build metadata
        id: meta
        # Untrusted context (a branch/tag name is attacker-controllable) is passed via
        # env and referenced as quoted shell variables, never interpolated directly into
        # the script — otherwise a ref named e.g. `$(curl …)` would run in this step.
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        # The image tag names the build in the registry: the release tag, or for a main
        # build its commit (`main-<12-character commit>`), never a moving `main`. Deploy
        # runs each image by its digest (the deploy job), not by this tag.
        #
        # The version stamped into the backend image (TF-18 section 2): a release build, the
        # only one with a tag ref, stamps VERSION as it is; a build of main stamps VERSION
        # marked as a development build (0.1.0-dev, 0.1.0-rc.1.dev), so a build of main after
        # a release tag never reports that release's version (scripts/build-version.sh).
        run: |
          REPO=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          echo "repo_name=${REPO}" >> "$GITHUB_OUTPUT"
          GIT_SHA=$(git rev-parse --short=12 HEAD)
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            APP_VERSION=$(./scripts/build-version.sh --release "$REF_NAME")
          elif [ "$REF_NAME" = "main" ]; then
            TAG="main-${GIT_SHA}"
            APP_VERSION=$(./scripts/build-version.sh)
          else
            # prepare runs for a push to main and a published release only.
            echo "::error::Images are built from main or from a release tag, not from this branch."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "git_sha=${GIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Version stamped into the backend image: \`${APP_VERSION}\`, commit \`${GIT_SHA}\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Detect GCP deploy credentials
        # The `secrets` context cannot be used in a job-level `if`, so resolve it
        # here and gate the build/deploy jobs on this output. When GCP is not yet
        # configured (no WIF provider secret) the image-build and deploy jobs skip
        # cleanly instead of failing the run.
        id: gate
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: |
          if [ -n "${WIF_PROVIDER}" ]; then
            echo "gcp_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "GCP_WIF_PROVIDER is not set — skipping image build and deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "gcp_configured=false" >> "$GITHUB_OUTPUT"
          fi

  build-backend:
    needs: prepare
    if: needs.prepare.outputs.gcp_configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      # The digest of the image this build pushed (sha256:…), which deploy runs. Only the
      # digest: the image name holds the registry project, a secret, and GitHub drops a job
      # output that contains one.
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: reg-${{ env.GCP_ENV }}-${{ env.GCP_REGION_SHORT }}-gh-actions@${{ env.REGISTRY_PROJECT_ID }}.iam.gserviceaccount.com
          project_id: ${{ env.REGISTRY_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Build & push backend (root context, build identity baked)
        id: build
        # The digest comes from the build itself: gcloud prints the build's log and then, last,
        # the digest Cloud Build recorded for the image it pushed (`--format`). pipefail, so a
        # failed build still fails this step through the `tee`.
        run: |
          set -o pipefail
          gcloud builds submit \
            --project=${{ env.REGISTRY_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --config=ci/cloudbuild.backend.yaml \
            --substitutions=_IMAGE=${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_PROJECT_ID }}/${{ env.AR_REPO }}/${{ needs.prepare.outputs.repo_name }}-backend:${{ needs.prepare.outputs.tag }},_APP_VERSION=${{ needs.prepare.outputs.app_version }},_GIT_SHA=${{ needs.prepare.outputs.git_sha }} \
            --gcs-source-staging-dir=gs://${{ env.CLOUDBUILD_BUCKET }}/source \
            --service-account=projects/${{ env.REGISTRY_PROJECT_ID }}/serviceAccounts/reg-${{ env.GCP_ENV }}-${{ env.GCP_REGION_SHORT }}-cb-runner@${{ env.REGISTRY_PROJECT_ID }}.iam.gserviceaccount.com \
            --format='value(results.images[0].digest)' \
            . | tee "$RUNNER_TEMP/build-output"
          DIGEST=$(tail -n 1 "$RUNNER_TEMP/build-output")
          if ! printf '%s' "$DIGEST" | grep -Eqx 'sha256:[0-9a-f]{64}'; then
            echo "::error::Cloud Build reported no digest for the backend image it pushed, and deploy runs an image only by its digest."
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Backend image digest: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

  build-frontend:
    needs: prepare
    if: needs.prepare.outputs.gcp_configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      # As build-backend's: the digest only.
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: reg-${{ env.GCP_ENV }}-${{ env.GCP_REGION_SHORT }}-gh-actions@${{ env.REGISTRY_PROJECT_ID }}.iam.gserviceaccount.com
          project_id: ${{ env.REGISTRY_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Build & push frontend (VITE_API_BASE_URL=/api baked)
        id: build
        # Where users report a problem: the repository variable COGA_PROBLEM_REPORT_URL, the
        # CMGGMC probleemmelding route (TF-16, TF-17), passed via env and quoted. Unset, the
        # clinical build shows no problem-report link, never the public GitHub issue form.
        # The digest is read from the build as in build-backend.
        env:
          PROBLEM_REPORT_URL: ${{ vars.COGA_PROBLEM_REPORT_URL }}
        run: |
          set -o pipefail
          SUBSTITUTIONS="_IMAGE=${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_PROJECT_ID }}/${{ env.AR_REPO }}/${{ needs.prepare.outputs.repo_name }}-frontend:${{ needs.prepare.outputs.tag }}"
          if [ -n "${PROBLEM_REPORT_URL}" ]; then
            # gcloud splits --substitutions on commas.
            case "${PROBLEM_REPORT_URL}" in
              *,*) echo "::error::COGA_PROBLEM_REPORT_URL must not contain a comma."; exit 1 ;;
            esac
            SUBSTITUTIONS="${SUBSTITUTIONS},_PROBLEM_REPORT_URL=${PROBLEM_REPORT_URL}"
          fi
          gcloud builds submit \
            --project=${{ env.REGISTRY_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --config=ci/cloudbuild.frontend.yaml \
            --substitutions="${SUBSTITUTIONS}" \
            --gcs-source-staging-dir=gs://${{ env.CLOUDBUILD_BUCKET }}/source \
            --service-account=projects/${{ env.REGISTRY_PROJECT_ID }}/serviceAccounts/reg-${{ env.GCP_ENV }}-${{ env.GCP_REGION_SHORT }}-cb-runner@${{ env.REGISTRY_PROJECT_ID }}.iam.gserviceaccount.com \
            --format='value(results.images[0].digest)' \
            . | tee "$RUNNER_TEMP/build-output"
          DIGEST=$(tail -n 1 "$RUNNER_TEMP/build-output")
          if ! printf '%s' "$DIGEST" | grep -Eqx 'sha256:[0-9a-f]{64}'; then
            echo "::error::Cloud Build reported no digest for the frontend image it pushed, and deploy runs an image only by its digest."
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Frontend image digest: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [prepare, build-backend, build-frontend]
    # Apply only when GCP is configured, and from ONE trigger (#520): pushes to
    # main (COGA_DEPLOY_TRIGGER unset or 'main', the documented default) or
    # published releases (COGA_DEPLOY_TRIGGER=release). There is one environment and one
    # state, so letting both apply would have a main push overwrite a release deployment.
    # Never for a pull request or a merge-queue group.
    if: ${{ needs.prepare.outputs.gcp_configured == 'true' && ((github.event_name == 'release' && vars.COGA_DEPLOY_TRIGGER == 'release') || (github.event_name == 'push' && (vars.COGA_DEPLOY_TRIGGER || 'main') == 'main' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    # Gate every infrastructure apply behind a protected GitHub Environment. Configure
    # required reviewers on the `gcp-deploy` environment (Settings → Environments) so a
    # human approves before Terraform runs. Without that protection rule the job refuses
    # to deploy (its first step). Covers the current dev target and any future prod
    # target — `terraform apply -auto-approve` must never run unattended.
    environment: gcp-deploy
    # Serialize every apply against this environment, across refs. The workflow-level
    # concurrency above is keyed on the ref, so a release run and a main-push run sit in
    # different groups and would otherwise reach `terraform apply` at the same time against
    # the same state file. The state is per-environment, so the lock must be too.
    concurrency:
      group: terraform-apply-gcp-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      # Read the gcp-deploy environment's protection rules (the first step below).
      actions: read
    steps:
      - name: Refuse to deploy without required reviewers on gcp-deploy
        # The environment above only gates the apply once it has required reviewers. Until
        # someone adds them, `terraform apply -auto-approve` would run unattended, so this
        # step stops the job before it touches the cloud (#364).
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          reviewers=$(gh api "repos/$REPOSITORY/environments/gcp-deploy" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length')
          if [ "${reviewers:-0}" -lt 1 ]; then
            echo "::error::The gcp-deploy environment has no required reviewers. Add at least one under Settings -> Environments -> gcp-deploy, then re-run this job."
            exit 1
          fi
          echo "gcp-deploy requires approval from $reviewers reviewer(s)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: coga-${{ env.GCP_ENV }}-${{ env.GCP_REGION_SHORT }}-gh-actions@${{ env.COGA_PROJECT_ID }}.iam.gserviceaccount.com
          project_id: ${{ env.COGA_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # terraform/versions.tf requires 1.11+ (write-only arguments).
          terraform_version: 1.16.6
      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="prefix=coga/${{ env.GCP_ENV }}"
      - name: Terraform variables kept in the environment
        # Every variable beyond the five passed below lives in the gcp-deploy
        # environment's COGA_TFVARS variable (HCL, no secrets), so a value set once is not
        # reverted to its default by the next deploy (#520). The -var flags still win.
        if: ${{ vars.COGA_TFVARS != '' }}
        working-directory: terraform
        env:
          COGA_TFVARS: ${{ vars.COGA_TFVARS }}
        run: printf '%s\n' "$COGA_TFVARS" > ci.auto.tfvars
      - name: Terraform Plan
        working-directory: terraform
        # Each image goes to Terraform by the digest its build job pushed (…@sha256:…), not
        # by a tag, which can be pushed again: the revision Cloud Run deploys is exactly the
        # image built in this run. Every build is a new digest, so every deploy changes the
        # image, Cloud Run rolls out, and the db-migrate job, keyed on the backend image,
        # runs again. Before that migration (or, in owner mode, before the rollout whose start
        # migrates) the apply takes an on-demand Cloud SQL backup with gcloud, and stops when
        # it fails (terraform/migrate.tf). A missing or malformed digest stops the deploy
        # before the plan.
        env:
          BACKEND_DIGEST: ${{ needs.build-backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ needs.build-frontend.outputs.digest }}
          REPO_NAME: ${{ needs.prepare.outputs.repo_name }}
        run: |
          for image in backend frontend; do
            if [ "$image" = backend ]; then digest="$BACKEND_DIGEST"; else digest="$FRONTEND_DIGEST"; fi
            if ! printf '%s' "$digest" | grep -Eqx 'sha256:[0-9a-f]{64}'; then
              echo "::error::build-${image} passed no image digest. Deploy runs an image only by the digest its build pushed."
              exit 1
            fi
          done
          IMAGES="${REGISTRY_HOST}/${REGISTRY_PROJECT_ID}/${AR_REPO}/${REPO_NAME}"
          terraform plan -out=tfplan \
            -var="project_id=${{ env.COGA_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="cmek_key_self_link=${{ secrets.GCP_COGA_CMEK_KEY_SELF_LINK }}" \
            -var="backend_image=${IMAGES}-backend@${BACKEND_DIGEST}" \
            -var="frontend_image=${IMAGES}-frontend@${FRONTEND_DIGEST}"
      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

  # ---- A release archives its own SBOMs ---------------------------------------
  release-sbom:
    # The CycloneDX SBOMs of the release (TF-13, TF-18 section 6a), made from the release
    # commit as ci.yml's `sbom` job makes them (the same script, generator pins and runtimes;
    # backend/tests/test_release_mechanics.py fails when the two drift apart), and attached
    # to the GitHub release with their SHA-256 sums. There they stay as long as the release
    # does, not the 90 days of a workflow artifact, and the release record cites them
    # (RELEASING.md section 4). Not gated on Google Cloud: an SBOM describes the
    # dependencies, whether or not images were built. Runs only after `prepare` passed, so
    # a release refused there (tag not v<VERSION>, or not on main) gets no evidence.
    needs: prepare
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      # Attach files to the release, and nothing else.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Generate the SBOMs (backend requirements.txt, frontend package-lock.json)
        run: ./scripts/generate-sbom.sh --native
      - name: Attach the SBOMs and their SHA-256 sums to the release
        # Never --clobber: an SBOM already attached is evidence and is not replaced. A re-run
        # of this job after the files were attached therefore fails, and the first files stay.
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          (cd sbom && sha256sum backend.cdx.json frontend.cdx.json > sbom-sha256sums.txt)
          cat sbom/sbom-sha256sums.txt
          gh release upload "$TAG" --repo "$REPOSITORY" \
            sbom/backend.cdx.json sbom/frontend.cdx.json sbom/sbom-sha256sums.txt
          {
            echo "SBOMs attached to release ${TAG} (SHA-256):"
            echo '```'
            cat sbom/sbom-sha256sums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
