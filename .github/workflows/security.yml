name: Security

# Dependency-vulnerability, secret, and SAST gates — the security counterpart to
# ci.yml (which runs the tests). Mark "deps", "secret-scan" and the CodeQL checks as
# required status checks in branch protection so a known-vulnerable dependency, a
# committed secret, or a newly-introduced code-scanning alert blocks merge.
#
# Every suppression (the one no-fix dependency, the CI test-fixture allowlist, the
# report-only dev-tree advisories) is documented and code-reviewed in
# SECURITY-AUDIT-ALLOWLIST.md.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deps:
    name: deps (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - name: Audit backend dependencies (hash-locked)
        # BLOCKING. Audits the exact locked set; any advisory fails the job. The former
        # ecdsa Minerva carve-out (GHSA-wj6h-64fc-37mp) was retired when JWT handling
        # migrated to PyJWT, which drops the python-jose -> ecdsa dependency entirely.
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r backend/requirements.txt --require-hashes
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit frontend production dependencies (high+)
        # BLOCKING on the deployed (production) tree only: any new high/critical fails.
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Report dev-tree advisories (non-blocking)
        # The remaining advisories are build/test-only (vitest/eslint toolchain), not in
        # the shipped artifact. Surfaced as a warning; flip to blocking after the
        # toolchain upgrade (see SECURITY-AUDIT-ALLOWLIST.md).
        if: always()
        working-directory: frontend
        run: |
          npm audit --audit-level=high \
            || echo "::warning::dev-tree advisories present (build/test toolchain) — tracked, non-blocking"

  secret-scan:
    name: secret-scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        # The gitleaks binary directly, not gitleaks-action@v2: under the
        # CenterForMedicalGeneticsGhent org the action requires a paid GITLEAKS_LICENSE.
        # The binary is MIT-licensed and free, and uses the same .gitleaks.toml config.
        # `detect` scans the full git history (fetch-depth: 0 above), exiting non-zero
        # when a non-allowlisted secret is found.
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release checksums file.
          # Bump alongside GITLEAKS_VERSION. Verified before extraction so a tampered or
          # swapped release artifact can't run in CI.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
          ./gitleaks detect --no-banner --redact --config .gitleaks.toml --source .

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          # Interpreted languages need no compilation step.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze
        # On a pull_request, the Code Scanning check fails only on alerts INTRODUCED by
        # the PR diff; pre-existing alerts populate the Security tab without blocking —
        # that diff-baseline is how the existing backlog is handled without an allowlist.
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:${{ matrix.language }}"
