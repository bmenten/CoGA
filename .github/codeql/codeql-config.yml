name: CoGA CodeQL config

# Focus analysis on first-party source; the security-extended suite adds the
# higher-recall security queries. Pre-existing alerts are baselined per-PR by
# CodeQL itself (see .github/workflows/security.yml), so this config only scopes
# WHAT is analysed, not what blocks.
queries:
  - uses: security-extended

# The production frontend server, its API proxy and CSP (frontend/*.mjs), and the scripts,
# one of which (clinical_cnv_knowledgebase.py) the admin knowledgebase rebuild runs.
paths:
  - backend/app
  - frontend/src
  - "frontend/*.mjs"
  - scripts

paths-ignore:
  - backend/tests
  - "frontend/src/**/*.test.ts"
  - "frontend/src/**/*.test.tsx"
  - frontend/src/test
  - frontend/dist
  - "**/node_modules"
