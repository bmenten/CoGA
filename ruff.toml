# Python lint gate (#526), run by the `backend` CI job. Pyflakes, plus the bugbear checks
# that catch real defects: a closure that captures a loop variable (B023) and a re-raise
# that loses its cause (B904); and the async rules, which catch blocking I/O inside an async
# function, where it would stall every request on the single worker (#527).
target-version = "py312"
extend-exclude = ["frontend", "data", "demo", "docs"]

[lint]
select = ["E9", "F", "B023", "B904", "ASYNC"]

[lint.per-file-ignores]
# Command-line scripts and tests block no server.
"scripts/**" = ["ASYNC"]
"backend/tests/**" = ["ASYNC"]
