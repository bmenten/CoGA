# Type-check gate (#526), run by the `backend` CI job over the clinical-critical modules:
# classification and scoring, the traceability and sign-out stack, and sample integrity.
# Each one type-checks clean; add a module once it does. The rest of backend/app is not
# gated yet (about 300 errors when measured for #526; haplotype_lineage_service and
# clickhouse_family_variants are the largest).
[mypy]
python_version = 3.12
files =
    backend/app/services/acmg_points.py,
    backend/app/services/annotation_manifest_service.py,
    backend/app/services/assembly_scope.py,
    backend/app/services/classification_drift_service.py,
    backend/app/services/clinical_audit_service.py,
    backend/app/services/cnv_acmg_points.py,
    backend/app/services/family_variant_filters.py,
    backend/app/services/genotypes.py,
    backend/app/services/hash_chain.py,
    backend/app/services/integrity_anchor_service.py,
    backend/app/services/mitochondrial_analysis.py,
    backend/app/services/monarch_semsim.py,
    backend/app/services/nipt_analysis.py,
    backend/app/services/nipt_service.py,
    backend/app/services/qc_threshold_service.py,
    backend/app/services/report_signout_service.py,
    backend/app/services/review_pg_utils.py,
    backend/app/services/sample_integrity_qc.py,
    backend/app/services/sample_integrity_service.py,
    backend/app/services/variant_ranking_cache.py
# Imported modules are analysed for their types, but only the listed files report errors.
follow_imports = silent
ignore_missing_imports = True
